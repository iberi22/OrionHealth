<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Offline | OrionHealth</title>
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/svg+xml" href="/OrionHealth/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-accent: #00FF85;
      --color-secondary: #00E0FF;
      --color-bg: #0A0A0A;
      --color-card: rgba(255, 255, 255, 0.03);
      --color-text: #F5F5DC;
    }

    * {
      font-family: 'Space Grotesk', sans-serif;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
      padding: 20px;
    }

    /* Cyber Background Effects */
    .bg-effects {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 133, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 133, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      transform: perspective(500px) rotateX(60deg) translateY(-100px);
      mask-image: linear-gradient(to bottom, transparent, black);
    }

    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 255, 133, 0.1) 0%, transparent 70%);
      filter: blur(50px);
    }

    .container {
      max-width: 500px;
      width: 100%;
      z-index: 1;
    }

    .card {
      background: var(--color-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
    }

    .logo-container {
      margin-bottom: 30px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--color-accent), var(--color-secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 255, 133, 0.3);
    }

    .logo-text {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: var(--color-accent);
    }

    .status-icon {
      margin: 20px 0;
      color: #FF4B4B;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .description {
      font-size: 16px;
      color: rgba(245, 245, 220, 0.6);
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .lang-section {
      margin-bottom: 25px;
    }

    .lang-section:last-of-type {
      margin-bottom: 40px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      width: 100%;
      margin-bottom: 12px;
      border: none;
    }

    .btn-primary {
      background: var(--color-accent);
      color: #0A0A0A;
      box-shadow: 0 4px 15px rgba(0, 255, 133, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 255, 133, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--color-text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: rgba(245, 245, 220, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="bg-effects">
    <div class="grid"></div>
    <div class="glow"></div>
  </div>

  <div class="container">
    <div class="card" id="offline-card">
      <div class="logo-container">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="logo-text">ORION<span>HEALTH</span></div>
      </div>

      <div class="status-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <div class="lang-section">
        <h1>You're Offline</h1>
        <p class="description">It seems you've lost your connection. This page isn't available offline yet.</p>
      </div>

      <div class="lang-section">
        <h1>Estás Sin Conexión</h1>
        <p class="description">Parece que has perdido la conexión. Esta página aún no está disponible sin internet.</p>
      </div>

      <button onclick="retryConnection()" class="btn btn-primary" id="retry-btn">
        Retry / Reintentar
      </button>
      <a href="/OrionHealth/" class="btn btn-secondary">
        Go to Home / Ir al Inicio
      </a>

      <div class="footer">OrionHealth v1.1.0 • System Offline</div>
    </div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.getElementById('retry-btn');
      const card = document.getElementById('offline-card');

      if (navigator.onLine) {
        window.location.reload();
      } else {
        card.classList.remove('shake');
        void card.offsetWidth; // trigger reflow
        card.classList.add('shake');

        btn.textContent = "Still Offline / Sigue Sin Conexión";
        btn.style.background = "#FF4B4B";

        setTimeout(() => {
          btn.textContent = "Retry / Reintentar";
          btn.style.background = "";
        }, 2000);
      }
    }

    // Listen for online event to automatically reload
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
