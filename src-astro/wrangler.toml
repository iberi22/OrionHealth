name = "orionhealth-web"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# --- Canonical domain (owner decision 2026-10-15) ---
# The web lives at https://orionhealth.swal.network (Worker custom domain).
# workers_dev = true on purpose: orionhealth-web.iberi22.workers.dev keeps
# answering as a fallback / health check.
# The @astrojs/cloudflare adapter copies this into dist/server/wrangler.json, which is
# the config `wrangler deploy` uses. No zone_id or account_id here: they are resolved
# at deploy time (machine OAuth or CI), never in the public repo.
# NOTE: top-level keys must come BEFORE the first TOML table ([[kv_namespaces]]).
workers_dev = true

routes = [
  { pattern = "orionhealth.swal.network", custom_domain = true }
]

# --- Modo demo publica: mesh-only (costo 0, datos P2P Yjs, sin backend) ---
# Vault/R2/D1 NO aprovisionados a proposito (iberi22/swal-vault es privado;
# la demo no procesa PHI real). Para activar billing/vault en una ola futura:
#   1) publicar iberi22/swal-vault (o PAT en secrets de CI)
#   2) wrangler r2 bucket create swal-orionhealth-web-vault
#   3) wrangler d1 create swal-orionhealth-web-domain
#   4) restaurar [[r2_buckets]] / [[d1_databases]] aqui

[[kv_namespaces]]
binding = "SESSION"
id = "57e68d72ca7545c39630c03677f3ac9d"

[[kv_namespaces]]
binding = "SWAL_KV"
id = "9aef690dde244d51982f2947dba2d7aa"

[ai]
binding = "AI"

[vars]
NODE_VERSION = "20"
# Canonical URL for canonical/OG tags and normalize-wrangler-config.mjs.
PUBLIC_SITE_URL = "https://orionhealth.swal.network"
# workers.dev fallback (health checks / DNS propagation).
PUBLIC_FALLBACK_URL = "https://orionhealth-web.iberi22.workers.dev"
