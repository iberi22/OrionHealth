name = "orionhealth-signal"
main = "src/index.ts"
compatibility_date = "2024-04-01"
workers_dev = false

# Route to deploy (owner sets this up)
# routes = [
#   { pattern = "signal.orionhealth.swal.network", custom_domain = true }
# ]

[durable_objects]
bindings = [
  { name = "SIGNALING_ROOM", class_name = "SignalingRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

[vars]
ENVIRONMENT = "production"
ORIGIN_ALLOWLIST = "https://orionhealth.swal.network"
