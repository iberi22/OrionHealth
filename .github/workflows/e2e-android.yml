name: e2e-android

on:
  pull_request:
    paths:
      - "lib/**"
      - "integration_test/**"
      - "android/**"
      - "pubspec.yaml"
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Correr las 41 specs (nightly) además del smoke'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  smoke:
    name: "🤖 E2E smoke (emulador)"
    if: github.event_name != 'schedule' || github.repository == 'iberi22/OrionHealth'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Deps + codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Run smoke E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          # app_test.dart uses matchesGoldenFile (host-only, needs a writable fs) -> not runnable on-device.
          # Every smoke file runs even if an earlier one fails, so one run reports them all.
          script: rc=0; for f in critical_flows emergency vitals medications workouts; do flutter test integration_test/${f}_e2e_test.dart --flavor prod || rc=1; done; exit $rc

  full:
    name: "🌙 E2E nightly completa"
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get && dart run build_runner build --delete-conflicting-outputs
      - name: Run all integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: flutter test integration_test/ --flavor prod
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-android-failures
          path: |
            build/test_outputs/
            test-results/
          retention-days: 7
