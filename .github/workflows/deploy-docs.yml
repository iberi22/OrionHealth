name: Deploy Astro Site to Cloudflare Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.127.1"
          workingDirectory: "docs"
          command: pages deploy dist --project-name=orionhealth-docs

  smoke:
    name: "🩺 Post-deploy smoke"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify live endpoints
        run: |
          for path in "/" "/manifest.webmanifest" "/offline.html" "/medical-standards/" "/blog"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "https://orionhealth-docs.pages.dev$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
