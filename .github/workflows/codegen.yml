name: codegen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Run build_runner
        run: |
          cd packages/isar_agent_memory
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: update generated isar agent memory code"
          commit-message: "chore: update generated isar agent memory code"
          branch: "chore/update-generated-isar-agent-memory"
          body: "Automated PR to update generated isar agent memory code."
