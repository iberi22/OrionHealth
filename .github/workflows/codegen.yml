name: codegen

on:
  workflow_dispatch:
  # workflow_dispatch only works once the file is on main; pushing codegen/run triggers it from the integration branch.
  push:
    branches: ['codegen/run']

permissions:
  contents: write
  pull-requests: write

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Run build_runner
        run: |
          cd packages/isar_agent_memory
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: update generated isar agent memory code"
          commit-message: "chore: update generated isar agent memory code"
          branch: "chore/update-generated-isar-agent-memory"
          base: feat/orion-flutter
          body: "Automated PR to update generated isar agent memory code."
