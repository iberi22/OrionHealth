<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OrionHealth Emergency — Privacy-first medical assistant. PWA demo of the Emergency Data (Medical ID) feature.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

  <!-- PWA & iOS -->
  <meta name="theme-color" content="#10B981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OrionHealth">

  <!-- iOS icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" href="favicon.png"/>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph / SEO -->
  <meta property="og:title" content="OrionHealth Emergency (PWA)">
  <meta property="og:description" content="Privacy-first medical assistant — Emergency Data feature demo">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Splash screen style -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #10B981;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .splash-icon {
      width: 96px;
      height: 96px;
      background: white;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .splash-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .splash-subtitle {
      font-size: 14px;
      opacity: 0.9;
    }
    .splash-loader {
      margin-top: 12px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <title>OrionHealth Emergency (PWA)</title>
</head>
<body>
  <div class="splash" id="splash">
    <div class="splash-icon">🚨</div>
    <div class="splash-title">ORION<span style="opacity: 0.8">HEALTH</span></div>
    <div class="splash-subtitle">Emergency Data — PWA Demo</div>
    <div class="splash-loader"></div>
  </div>

  <script>
    // Hide splash when Flutter app is ready
    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('splash');
      if (splash) splash.style.display = 'none';
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
